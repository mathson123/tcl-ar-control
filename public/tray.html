<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCL Ar</title>
<style>
  :root { --text: #eef2f7; --mute: #8e9aab; --line: #ffffff14; --tile: #ffffff0a; --cool: #4cb4ff; --heat: #ff9a4c; --accent: var(--cool); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 13px/1.35 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  .card { position: absolute; inset: 0; border-radius: 18px; border: 1px solid #ffffff1c; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
          background: radial-gradient(120% 70% at 50% 0%, #1d2a3d 0%, #121822 55%, #0d1118 100%); box-shadow: 0 12px 40px #0009; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .tabs button { flex: none; padding: 5px 12px; border-radius: 99px; background: var(--tile); color: var(--mute); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .tabs button.sel { background: #4cb4ff26; color: var(--text); }
  .tabs .dot { width: 6px; height: 6px; border-radius: 50%; background: #556; }
  .tabs .dot.on { background: #34d399; }

  .head { display: flex; align-items: center; gap: 8px; }
  .head b { font-size: 15px; }
  .head .room { color: var(--mute); }
  .pwr { margin-left: auto; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #ffffff12; color: var(--mute); transition: .2s; }
  .pwr.on { background: var(--accent); color: #fff; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
  .pwr:disabled { opacity: .35; cursor: default; }

  .unit { position: relative; height: 150px; flex: none; }
  .unit svg { position: absolute; left: 50%; transform: translateX(-50%); }
  .flow path { stroke: url(#fade); stroke-width: 1.6; stroke-linecap: round; fill: none; opacity: 0; stroke-dasharray: 22 14; transition: opacity .4s; }
  .on .flow path { opacity: 1; animation: flow 2.2s linear infinite; }
  .flow path:nth-child(2n) { animation-delay: -.7s; } .flow path:nth-child(3n) { animation-delay: -1.4s; }
  @keyframes flow { to { stroke-dashoffset: -72; } }

  .temp { font-size: 54px; font-weight: 600; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .temp sup { font-size: 18px; font-weight: 500; color: var(--mute); margin-left: 2px; }
  .temp.off { color: var(--mute); }

  .slider { display: grid; grid-template-columns: 36px 1fr 36px; gap: 10px; align-items: center; }
  .circ { width: 36px; height: 36px; border-radius: 50%; background: var(--tile); border: 1px solid var(--line); font-size: 18px; display: grid; place-items: center; }
  .circ:hover { background: #ffffff16; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; border-radius: 99px; margin: 0; cursor: pointer;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, #1b2635), var(--accent)) 0 / var(--p) 100% no-repeat, #ffffff12; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px #0008; }
  .scale { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; padding: 0 46px; margin-top: -6px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; position: relative; }
  .tile { text-align: left; background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; display: grid; gap: 2px; min-height: 84px; align-content: start; }
  .tile:hover { background: #ffffff12; }
  .tile.sel { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .tile svg { margin-bottom: 6px; color: var(--mute); }
  .tile.sel svg { color: var(--accent); }
  .tile small { color: var(--mute); font-size: 11px; }
  .tile b { font-size: 13px; }
  .tile .top { display: flex; justify-content: space-between; align-items: start; }
  .sw { width: 34px; height: 20px; border-radius: 99px; background: #ffffff22; position: relative; transition: .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
  .sw.on { background: var(--accent); } .sw.on::after { left: 16px; }

  .opts { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: #1a2230; border: 1px solid #ffffff22; border-radius: 14px; padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; box-shadow: 0 8px 30px #000a; }
  .opts button { padding: 9px 4px; border-radius: 10px; color: var(--mute); }
  .opts button:hover { background: #ffffff10; color: var(--text); }
  .opts button.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); }

  .foot { margin-top: auto; display: flex; align-items: center; gap: 6px; color: var(--mute); font-size: 11px; }
  .foot .icon-btn { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--mute); }
  .foot .icon-btn:hover { background: var(--tile); color: var(--text); }
  .foot .spacer { margin-left: auto; }
  .spin svg { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #fca5a5; font-size: 12px; }
  .offline { flex: 1; display: grid; place-items: center; color: var(--mute); text-align: center; }

  form { display: grid; gap: 10px; margin-top: 10px; }
  form h2 { margin: 0 0 4px; font-size: 17px; }
  form p { margin: 0 0 6px; color: var(--mute); font-size: 12px; }
  input:not([type=range]) { background: #0b0f15; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit; }
  .primary { background: var(--accent); color: #fff; font-weight: 600; padding: 11px; border-radius: 10px; }
  .note { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--mute); font-size: 11.5px; line-height: 1.5; }
  .note b { color: var(--text); }
</style>
</head>
<body>
<div class="card" id="card">
  <form id="login" class="hidden">
    <h2>Entrar no TCL Home</h2>
    <p>Mesmo e-mail e senha do app TCL Home do celular.</p>
    <input name="username" type="email" placeholder="E-mail" autocomplete="username" required>
    <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
    <div class="note"><b>App não oficial</b> — não é da TCL nem aprovado por ela.<br>
      Compatível: aparelhos do <b>TCL Home</b>.<br>Não compatível: TCL Smart / Smart Life, Intelligent AC.</div>
  </form>
  <div id="ctl" class="hidden" style="display:contents"></div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v === undefined || v === null || v < 0 ? null : Number(v));
const TMIN = 16, TMAX = 31;
const I = {
  power: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg>',
  thermo: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>',
  cool: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/></svg>',
  fan: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.8"/><path d="M12 10c0-4 1-7 4-7s2 5-4 7zM14 12c4 0 7 1 7 4s-5 2-7-4zM12 14c0 4-1 7-4 7s-2-5 4-7zM10 12c-4 0-7-1-7-4s5-2 7 4z"/></svg>',
  wind: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>',
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  sync: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M3 21v-5h5"/></svg>',
  expand: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
};
// workMode padrão dos split TCL; alguns modelos usam outra ordem.
const MODES = [[0, "Auto"], [1, "Refrigerar"], [2, "Desumidif."], [3, "Ventilar"], [4, "Aquecer"]];
const FANS = [["Auto", { windSpeed: 0, turbo: 0, silenceSwitch: 0 }], ["Silêncio", { windSpeed: 2, turbo: 0, silenceSwitch: 1 }],
  ["Baixa", { windSpeed: 2, turbo: 0, silenceSwitch: 0 }], ["Média", { windSpeed: 4, turbo: 0, silenceSwitch: 0 }], ["Alta", { windSpeed: 6, turbo: 0, silenceSwitch: 0 }]];
const FANS7 = [["Auto", { windSpeedAutoSwitch: 1, windSpeed7Gear: 0 }], ...[1, 2, 3, 4, 5, 6].map((n) => [`Nível ${n}`, { windSpeedAutoSwitch: 0, windSpeed7Gear: n }])];

let devices = [], sel = null, pending = new Map(), lastSync = null, opts = null, err = "", loading = false;
try { sel = localStorage.getItem("tray.sel"); } catch {}

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", "x-tcl-ar": "1" }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || "Faça login"); }
  if (!r.ok) throw new Error(j.error || `Erro ${r.status}`);
  return j;
}
const st = (d) => ({ ...d.state, ...pending.get(d.id) });
const isOn = (d) => Number(st(d).powerSwitch) === 1;
const fanList = (s) => (s.windSpeed7Gear !== undefined && s.windSpeed === undefined ? FANS7 : FANS);
const matches = (s, v) => Object.entries(v).every(([k, x]) => Number(s[k] ?? 0) === x);

function showLogin() { $("#login").classList.remove("hidden"); $("#ctl").classList.add("hidden"); }

async function refresh() {
  if (loading) return;
  loading = true; render();
  try { devices = await api("/api/devices"); lastSync = new Date(); pending.clear(); err = ""; }
  catch (e) { err = e.message; }
  loading = false; render();
}

async function set(id, desired) {
  pending.set(id, { ...pending.get(id), ...desired }); opts = null; render();
  try { await api(`/api/devices/${encodeURIComponent(id)}`, { desired }); setTimeout(refresh, 2500); }
  catch (e) { pending.delete(id); err = "Não foi: " + e.message; render(); }
}

function unitSvg(d, target) {
  return `<svg width="300" height="150" viewBox="0 0 300 150">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dee6"/></linearGradient>
      <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="76" x2="0" y2="148"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="var(--accent)" stop-opacity=".5"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <rect x="30" y="10" width="240" height="62" rx="14" fill="url(#g)"/>
    <rect x="30" y="58" width="240" height="14" rx="7" fill="#c7ced8"/>
    <path d="M44 70h212" stroke="#aeb7c3" stroke-width="2"/>
    <text x="236" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="${isOn(d) ? "var(--accent)" : "#b8c0cc"}" font-family="Segoe UI">${isOn(d) ? target : ""}</text>
    <circle cx="46" cy="30" r="2.5" fill="${isOn(d) ? "#34d399" : "#b8c0cc"}"/>
    <g class="flow">${[62, 84, 106, 128, 150, 172, 194, 216, 238].map((x) => {
      const dx = (x - 150) * 0.35;
      return `<path d="M${x} 76 C ${x + dx * 0.2} 100, ${x + dx * 0.9 - 6} 118, ${x + dx} 148"/>`; }).join("")}</g>
  </svg>`;
}

function render() {
  const c = $("#ctl");
  if (!devices.length && !err) { c.innerHTML = `<div class="offline">${loading ? "Carregando…" : "Nenhum ar na conta"}</div>`; return; }
  if (!devices.find((d) => d.id === sel)) sel = devices[0]?.id ?? null;
  const d = devices.find((x) => x.id === sel);
  const sync = lastSync ? lastSync.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
  const foot = `<div class="foot">${I.ok}<span>${err ? `<span class="err">${esc(err)}</span>` : `Atualizado ${sync}`}</span>
      <button class="icon-btn spacer ${loading ? "spin" : ""}" data-act="sync" title="Atualizar">${I.sync}</button>
      <button class="icon-btn" data-act="full" title="Abrir painel completo">${I.expand}</button></div>`;
  if (!d) { c.innerHTML = foot; return; }

  const s = st(d), on = isOn(d), mode = Number(s.workMode);
  document.documentElement.style.setProperty("--accent", mode === 4 ? "var(--heat)" : "var(--cool)");
  const target = num(s.targetTemperature) ?? 24;
  const fans = fanList(s), fan = fans.find(([, v]) => matches(s, v));
  const tabs = devices.length > 1 ? `<div class="tabs">${devices.map((x) =>
    `<button class="${x.id === sel ? "sel" : ""}" data-tab="${esc(x.id)}"><span class="dot ${isOn(x) ? "on" : ""}"></span>${esc(x.name)}</button>`).join("")}</div>` : "";

  let optsHtml = "";
  if (opts === "mode") optsHtml = MODES.map(([v, l]) => `<button class="${mode === v ? "sel" : ""}" data-mode="${v}">${l}</button>`).join("");
  if (opts === "fan") optsHtml = fans.map(([l], i) => `<button class="${fan?.[0] === l ? "sel" : ""}" data-fan="${i}">${l}</button>`).join("");

  c.innerHTML = `${tabs}
    <div class="head">${I.thermo}<b>${esc(d.name)}</b><span class="room">${num(s.currentTemperature) ?? "--"}°C</span>
      <button class="pwr ${on ? "on" : ""}" data-act="power" ${d.online ? "" : "disabled"} aria-label="Ligar/desligar">${I.power}</button></div>
    ${d.online ? `
    <div class="unit ${on ? "on" : ""}">${unitSvg(d, target)}</div>
    <div class="temp ${on ? "" : "off"}" id="tempLbl">${target}<sup>°C</sup></div>
    <div class="slider">
      <button class="circ" data-step="-1" aria-label="Diminuir">−</button>
      <input type="range" id="rng" min="${TMIN}" max="${TMAX}" step="1" value="${target}" style="--p:${((target - TMIN) / (TMAX - TMIN)) * 100}%" aria-label="Temperatura">
      <button class="circ" data-step="1" aria-label="Aumentar">+</button>
    </div>
    <div class="scale"><span>${TMIN}°</span><span>${TMAX}°</span></div>
    <div class="tiles">
      ${optsHtml ? `<div class="opts">${optsHtml}</div>` : ""}
      <button class="tile ${opts === "mode" ? "sel" : ""}" data-opts="mode">${I.cool}<small>Modo</small><b>${MODES.find((m) => m[0] === mode)?.[1] ?? "—"}</b></button>
      <button class="tile ${opts === "fan" ? "sel" : ""}" data-opts="fan">${I.fan}<small>Ventilação</small><b>${fan?.[0] ?? "—"}</b></button>
      <button class="tile ${Number(s.turbo) === 1 ? "sel" : ""}" data-act="turbo"><span class="top">${I.wind}<span class="sw ${Number(s.turbo) === 1 ? "on" : ""}"></span></span><small>Turbo</small><b>${Number(s.turbo) === 1 ? "Ligado" : "Desligado"}</b></button>
    </div>` : `<div class="offline">Aparelho offline.<br>Confira o Wi-Fi do ar.</div>`}
    ${foot}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) { if (opts) { opts = null; render(); } return; }
  const d = devices.find((x) => x.id === sel);
  if (b.dataset.tab) { sel = b.dataset.tab; opts = null; try { localStorage.setItem("tray.sel", sel); } catch {} return render(); }
  if (b.dataset.act === "sync") return refresh();
  if (b.dataset.act === "full") return window.open("/");
  if (!d) return;
  const s = st(d);
  if (b.dataset.act === "power") return set(d.id, { powerSwitch: isOn(d) ? 0 : 1 });
  if (b.dataset.act === "turbo") return set(d.id, Number(s.turbo) === 1 ? { turbo: 0 } : { turbo: 1, silenceSwitch: 0, ...(isOn(d) ? {} : { powerSwitch: 1 }) });
  if (b.dataset.opts) { opts = opts === b.dataset.opts ? null : b.dataset.opts; return render(); }
  if (b.dataset.mode) return set(d.id, { workMode: Number(b.dataset.mode), ...(isOn(d) ? {} : { powerSwitch: 1 }) });
  if (b.dataset.fan) return set(d.id, fanList(s)[Number(b.dataset.fan)][1]);
  if (b.dataset.step) {
    const next = Math.min(TMAX, Math.max(TMIN, (num(s.targetTemperature) ?? 24) + Number(b.dataset.step)));
    return set(d.id, { targetTemperature: next });
  }
});
document.addEventListener("input", (e) => { // arrastando: só atualiza a tela
  if (e.target.id !== "rng") return;
  const v = Number(e.target.value);
  e.target.style.setProperty("--p", ((v - TMIN) / (TMAX - TMIN)) * 100 + "%");
  $("#tempLbl").innerHTML = `${v}<sup>°C</sup>`;
});
document.addEventListener("change", (e) => { // soltou: manda pro ar
  if (e.target.id === "rng") set(sel, { targetTemperature: Number(e.target.value) });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && opts) { opts = null; render(); } });

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target), btn = $("button", e.target);
  btn.disabled = true; btn.textContent = "Entrando…"; $("#loginErr").textContent = "";
  try { await api("/api/login", { username: f.get("username"), password: f.get("password") }); e.target.reset(); await start(); }
  catch (er) { $("#loginErr").textContent = er.message; }
  finally { btn.disabled = false; btn.textContent = "Entrar"; }
};

let timer;
async function start() {
  const s = await api("/api/status");
  if (!s.loggedIn) return showLogin();
  $("#login").classList.add("hidden"); $("#ctl").classList.remove("hidden");
  render(); await refresh();
  clearInterval(timer); timer = setInterval(() => document.hidden || refresh(), 15000);
}
window.addEventListener("focus", refresh); // painel abriu: atualiza na hora
start().catch((e) => { err = e.message; render(); });
</script>
</body>
</html>
