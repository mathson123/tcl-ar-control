name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (checksum verificado)
        env:
          V: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Procurar segredos no histórico
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - name: Sintaxe e self-test (assinatura AWS)
        run: |
          node --check server.mjs
          node --check main.mjs
          node server.mjs --selftest
