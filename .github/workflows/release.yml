name: release

# Tag v* (ex.: git tag v1.0.1 && git push --tags) gera o instalador e publica no GitHub Releases.
# Manual (Actions > release > Run workflow) só gera o instalador como artefato.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build:
    needs: security
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm pkg set "version=$($env:GITHUB_REF_NAME.TrimStart('v'))"
      - name: Gerar instalador
        run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador
          path: dist/*.exe
          if-no-files-found: error
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item dist/*.exe).FullName --repo $env:GITHUB_REPOSITORY --title "TCL Ar $env:GITHUB_REF_NAME" --generate-notes
